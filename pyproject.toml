[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutopt"
version = "0.1.0"
description = "Minimal cutting optimizer (1D/2D) with CLI"
authors = [{ name = "Cursor AI" }]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["cutting stock", "optimizer", "bin packing", "guillotine"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
cutopt = "cutopt.cli:main"
